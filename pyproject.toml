[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rt-data-platform"
version = "0.1.0"
description = "Real-time partitioned Kafka event ingestion, dead-letter quarantine, SQL warehouse deduplication, and BigQuery staging compiler"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Colin Sohn", email = "183441695+colinsohn@users.noreply.github.com"}
]
dependencies = [
  "duckdb>=1.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
rt-data-platform = "rt_data_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
