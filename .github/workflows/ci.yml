name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Python, DuckDB & Stream Processor Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile all Python modules
        run: |
          python -m py_compile platform_core/*.py cmd_demo.py benchmark.py tests/*.py

      - name: Run unit and warehouse reconciliation tests
        run: |
          python -B -m unittest discover -s tests -v

      - name: Run CLI demonstration and benchmark verification
        run: |
          python -B cmd_demo.py >/dev/null
          python -B benchmark.py --events 10000 --batch-size 1000 >/dev/null
